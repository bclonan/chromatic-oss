name: Test and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip "setuptools>=83.0.0"
      - run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[test]"
      - run: python -m pip check
      - run: rustup toolchain install 1.96.0 --profile minimal
      - run: rustup override set 1.96.0
      - run: python scripts/build_native_hue.py --test
      - run: python -m pytest --junitxml=artifacts/ci/tests.xml
      - run: python -m pip wheel . --no-deps --wheel-dir artifacts/ci/wheel
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.os }}-py${{ matrix.python }}
          path: artifacts/ci

  minimum:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip "setuptools>=83.0.0"
      - run: python -m pip install torch==2.14.1 torchvision==0.29.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements/minimum.txt
      - run: python -m pip install --no-deps -e ".[test]"
      - run: rustup toolchain install 1.96.0 --profile minimal
      - run: rustup override set 1.96.0
      - run: python scripts/build_native_hue.py --test
      - run: python -m pip check
      - run: python -m pytest --junitxml=artifacts/ci/minimum-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minimum-py311
          path: artifacts/ci
