[build]
  command = "python -m pip install -r requirements/docs.txt && python scripts/build_docs_site.py"
  publish = "dist/docs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
