[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "chromatensor"
version = "0.2.0"
description = "Reproducible chromatic tensor and quantization research"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "COPYRIGHT", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "Brad Clonan"}]
dependencies = ["torch>=2.14.1", "numpy>=2.4.6", "torchvision>=0.29.1", "matplotlib>=3.11.2", "psutil>=7.2.2"]

[project.optional-dependencies]
test = ["pytest>=9.1.1"]

[tool.setuptools.packages.find]
include = ["chromatensor*", "experiments*", "dashboard*"]

[tool.setuptools.package-data]
dashboard = ["*.html", "*.js", "*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

